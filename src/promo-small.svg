<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title description">
  <title id="title">BRouter Imperial promotional tile</title>
  <desc id="description">A blue route crosses a dark topographic background and a disc labeled miles and feet</desc>

  <defs>
